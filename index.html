<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de las Ideologías</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #fdfaf5;
            --accent: #7c9082;
            --text: #333;
            --line: #d1d1d1;
        }

        * { box-sizing: border-box; touch-action: manipulation; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 { font-weight: 700; margin: 20px 0; font-size: 1.5rem; }

        /* Pantalla 1 */
        #screen-setup {
            width: 90%;
            max-width: 400px;
            text-align: center;
            margin-top: 50px;
        }

        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            flex-grow: 1;
            font-family: inherit;
        }

        .name-tag {
            display: inline-block;
            background: #eee;
            padding: 5px 12px;
            border-radius: 8px;
            margin: 4px;
            font-size: 0.9rem;
        }

        button {
            padding: 12px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* Pantalla 2: El Juego */
        #screen-game { 
            display: none; 
            width: 100vw; 
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            background: var(--bg);
        }

        #export-area {
            position: relative;
            width: 100%;
            height: calc(100% - 80px); /* Espacio para botones abajo */
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* El Mapa (Cruz) */
        .map-wrapper {
            position: relative;
            width: 85vw;
            height: 85vw;
            max-width: 600px;
            max-height: 600px;
        }

        .axis-h { position: absolute; top: 50%; width: 100%; height: 2px; background: var(--line); z-index: 1; }
        .axis-v { position: absolute; left: 50%; height: 100%; width: 2px; background: var(--line); z-index: 1; }

        /* Etiquetas fuera de los ejes */
        .label {
            position: absolute;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #999;
            z-index: 2;
        }
        .top { top: -25px; left: 50%; transform: translateX(-50%); color: #4a90e2; }
        .bottom { bottom: -25px; left: 50%; transform: translateX(-50%); color: #e67e22; }
        .left { left: -10px; top: 50%; transform: translate(-100%, -50%); }
        .right { right: -10px; top: 50%; transform: translate(100%, -50%); }

        /* Fichas */
        .player-chip {
            position: absolute;
            padding: 8px 16px;
            background: white;
            border: 2px solid var(--accent);
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: move;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            white-space: nowrap;
            touch-action: none; /* BLOQUEA EL SCROLL AL MOVER */
        }

        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 20;
        }

        .btn-small { padding: 10px 15px; font-size: 0.8rem; background: #555; }
    </style>
</head>
<body>

<div id="screen-setup">
    <h1>Juego de las ideologías</h1>
    <div class="input-group">
        <input type="text" id="nameInput" placeholder="Nombre...">
        <button onclick="addName()">+</button>
    </div>
    <div id="nameList" style="margin-bottom: 20px;"></div>
    <button id="btnStart" onclick="startGame()" style="width:100%" disabled>Empezar Juego</button>
</div>

<div id="screen-game">
    <div id="export-area">
        <div class="map-wrapper" id="map">
            <div class="axis-h"></div>
            <div class="axis-v"></div>
            <div class="label top">Peronismo</div>
            <div class="label bottom">Antiperonismo</div>
            <div class="label left">Izquierda</div>
            <div class="label right">Derecha</div>
        </div>
    </div>
    
    <div class="controls">
        <button onclick="download()">📸 Guardar Imagen</button>
        <button class="btn-small" onclick="location.reload()">Reiniciar</button>
    </div>
</div>

<script>
    let players = [];

    function addName() {
        const input = document.getElementById('nameInput');
        const n = input.value.trim();
        if(n) {
            players.push(n);
            document.getElementById('nameList').innerHTML += `<span class="name-tag">${n}</span>`;
            input.value = '';
            document.getElementById('btnStart').disabled = false;
        }
    }

    function startGame() {
        document.getElementById('screen-setup').style.display = 'none';
        document.getElementById('screen-game').style.display = 'block';
        const map = document.getElementById('map');
        
        players.forEach((name, i) => {
            const div = document.createElement('div');
            div.className = 'player-chip';
            div.innerText = name;
            div.style.left = '40%';
            div.style.top = (20 + (i * 40)) + 'px'; // Los apila un poco al inicio
            initDrag(div);
            map.appendChild(div);
        });
    }

    function initDrag(el) {
        let x = 0, y = 0;

        el.addEventListener('mousedown', start);
        el.addEventListener('touchstart', start, {passive: false});

        function start(e) {
            e.preventDefault();
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            x = cx; y = cy;
            document.onmousemove = move;
            document.ontouchmove = move;
            document.onmouseup = stop;
            document.ontouchend = stop;
        }

        function move(e) {
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            const dx = x - cx;
            const dy = y - cy;
            x = cx; y = cy;
            el.style.top = (el.offsetTop - dy) + "px";
            el.style.left = (el.offsetLeft - dx) + "px";
        }

        function stop() {
            document.onmousemove = document.onmouseup = null;
            document.ontouchmove = document.ontouchend = null;
        }
    }

    function download() {
        // Ocultamos controles un segundo para la foto
        html2canvas(document.getElementById('export-area'), { backgroundColor: "#fdfaf5" }).then(canvas => {
            const a = document.createElement('a');
            a.download = 'ideologia-grupo.png';
            a.href = canvas.toDataURL();
            a.click();
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Juego de las Ideologías</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #fdfaf5; --accent: #7c9082; --text: #333; --line: #d1d1d1; }
        * { box-sizing: border-box; touch-action: manipulation; }
        
        html, body { 
            height: 100%; margin: 0; padding: 0;
            font-family: 'Quicksand', sans-serif; background-color: var(--bg);
            overflow: hidden; position: fixed; width: 100%;
        }

        /* Pantalla 1 */
        #screen-setup {
            display: flex; flex-direction: column; align-items: center;
            padding: 30px 20px; text-align: center; height: 100%;
        }
        .input-group { display: flex; gap: 8px; width: 100%; max-width: 350px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-family: inherit; font-size: 16px; /* Evita zoom en iOS */ }
        .name-tag { display: inline-block; background: #eee; padding: 5px 12px; border-radius: 8px; margin: 4px; font-size: 0.8rem; }

        /* Pantalla 2 */
        #screen-game { 
            display: none; height: 100%; width: 100%;
            flex-direction: column; justify-content: space-between;
        }

        #export-area {
            flex-grow: 1;
            display: flex; align-items: center; justify-content: center;
            position: relative; padding: 10px;
            overflow: hidden;
        }

        .map-wrapper {
            position: relative;
            width: 88vw; height: 88vw;
            max-width: 450px; max-height: 450px;
            background: white; border: 1px solid #eee;
        }

        .axis-h { position: absolute; top: 50%; width: 100%; height: 1.5px; background: var(--line); pointer-events: none; }
        .axis-v { position: absolute; left: 50%; height: 100%; width: 1.5px; background: var(--line); pointer-events: none; }

        .label {
            position: absolute; font-weight: 700; font-size: 0.65rem;
            text-transform: uppercase; color: #888; background: rgba(253, 250, 245, 0.9);
            padding: 2px 4px; border-radius: 3px; z-index: 5; pointer-events: none;
        }
        .top { top: 5px; left: 50%; transform: translateX(-50%); color: #4a90e2; }
        .bottom { bottom: 5px; left: 50%; transform: translateX(-50%); color: #e67e22; }
        .left { left: 5px; top: 50%; transform: translateY(-50%); }
        .right { right: 5px; top: 50%; transform: translateY(-50%); }

        .player-chip {
            position: absolute; padding: 6px 12px; background: white;
            border: 1.5px solid var(--accent); border-radius: 20px;
            font-weight: 600; font-size: 0.8rem; cursor: move;
            z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            white-space: nowrap; touch-action: none;
        }

        .controls {
            height: 100px; /* Espacio fijo y generoso para botones */
            display: flex; flex-direction: column; gap: 8px;
            justify-content: center; align-items: center;
            padding-bottom: env(safe-area-inset-bottom); /* Soporte para iPhone notch */
            background: var(--bg);
        }

        .row-btns { display: flex; gap: 10px; width: 100%; justify-content: center; }

        button {
            padding: 12px 24px; background: var(--accent); color: white;
            border: none; border-radius: 10px; font-weight: 600; cursor: pointer;
            font-family: inherit;
        }
        .btn-start { width: 100%; max-width: 300px; }
        .btn-alt { background: #888; font-size: 0.75rem; padding: 8px 16px; }
    </style>
</head>
<body>

<div id="screen-setup">
    <h2 style="margin-bottom: 10px;">Juego de las ideologías</h2>
    <div class="input-group">
        <input type="text" id="nameInput" placeholder="Nombre...">
        <button onclick="addName()">+</button>
    </div>
    <div id="nameList"></div>
    <div style="flex:1"></div>
    <button id="btnStart" class="btn-start" onclick="startGame()" disabled>Empezar</button>
</div>

<div id="screen-game">
    <div id="export-area">
        <div class="map-wrapper" id="map">
            <div class="axis-h"></div>
            <div class="axis-v"></div>
            <div class="label top">Peronismo</div>
            <div class="label bottom">Antiperonismo</div>
            <div class="label left">Izquierda</div>
            <div class="label right">Derecha</div>
        </div>
    </div>
    
    <div class="controls">
        <button onclick="download()" style="width: 200px;">📸 Guardar Imagen</button>
        <button class="btn-alt" onclick="location.reload()">Reiniciar</button>
    </div>
</div>

<script>
    let players = [];

    function addName() {
        const input = document.getElementById('nameInput');
        const n = input.value.trim();
        if(n) {
            players.push(n);
            document.getElementById('nameList').innerHTML += `<span class="name-tag">${n}</span>`;
            input.value = '';
            document.getElementById('btnStart').disabled = false;
        }
    }

    function startGame() {
        document.getElementById('screen-setup').style.display = 'none';
        document.getElementById('screen-game').style.display = 'flex';
        const map = document.getElementById('map');
        
        players.forEach((name, i) => {
            const div = document.createElement('div');
            div.className = 'player-chip';
            div.innerText = name;
            // Distribución inicial para evitar que se amontonen
            div.style.left = '10px';
            div.style.top = (10 + (i * 35)) + 'px';
            initDrag(div);
            map.appendChild(div);
        });
    }

    function initDrag(el) {
        let x = 0, y = 0;
        el.addEventListener('mousedown', start);
        el.addEventListener('touchstart', start, {passive: false});

        function start(e) {
            e.preventDefault();
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            x = cx; y = cy;
            document.onmousemove = move;
            document.ontouchmove = move;
            document.onmouseup = stop;
            document.ontouchend = stop;
        }

        function move(e) {
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            const dx = x - cx;
            const dy = y - cy;
            x = cx; y = cy;
            
            let nt = el.offsetTop - dy;
            let nl = el.offsetLeft - dx;
            const p = el.parentElement;
            
            if(nt > 0 && nt < (p.offsetHeight - el.offsetHeight)) el.style.top = nt + "px";
            if(nl > 0 && nl < (p.offsetWidth - el.offsetWidth)) el.style.left = nl + "px";
        }

        function stop() {
            document.onmousemove = document.onmouseup = null;
            document.ontouchmove = document.ontouchend = null;
        }
    }

    function download() {
        const area = document.getElementById('export-area');
        html2canvas(area, { 
            backgroundColor: "#fdfaf5", 
            scale: 2,
            useCORS: true 
        }).then(canvas => {
            const a = document.createElement('a');
            a.download = 'nuestras-ideologias.png';
            a.href = canvas.toDataURL("image/png");
            a.click();
        });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego de las Ideologías</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #fdfaf5; --accent: #7c9082; --text: #333; --line: #d1d1d1; }
        * { box-sizing: border-box; touch-action: manipulation; }
        
        body, html { 
            height: 100%; margin: 0; padding: 0;
            font-family: 'Quicksand', sans-serif; background-color: var(--bg);
            overflow: hidden; /* Prohibido el scroll */
        }

        /* Pantalla 1 */
        #screen-setup {
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px; text-align: center; height: 100%;
        }
        .input-group { display: flex; gap: 8px; width: 100%; max-width: 350px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-family: inherit; }
        .name-tag { display: inline-block; background: #eee; padding: 5px 12px; border-radius: 8px; margin: 4px; font-size: 0.8rem; }

        /* Pantalla 2 */
        #screen-game { 
            display: none; height: 100vh; width: 100vw;
            flex-direction: column;
        }

        #export-area {
            flex: 1; /* Toma todo el espacio disponible menos los botones */
            display: flex; align-items: center; justify-content: center;
            position: relative; padding: 20px;
        }

        .map-wrapper {
            position: relative;
            width: 90vw; height: 90vw; /* Cuadrado basado en el ancho */
            max-width: 500px; max-height: 500px;
            background: white; border-radius: 4px;
        }

        .axis-h { position: absolute; top: 50%; width: 100%; height: 1.5px; background: var(--line); }
        .axis-v { position: absolute; left: 50%; height: 100%; width: 1.5px; background: var(--line); }

        /* Etiquetas internas con fondo para legibilidad */
        .label {
            position: absolute; font-weight: 700; font-size: 0.7rem;
            text-transform: uppercase; color: #888; background: var(--bg);
            padding: 2px 6px; border-radius: 4px; z-index: 5;
        }
        .top { top: 5px; left: 50%; transform: translateX(-50%); color: #4a90e2; }
        .bottom { bottom: 5px; left: 50%; transform: translateX(-50%); color: #e67e22; }
        .left { left: 5px; top: 50%; transform: translateY(-50%); }
        .right { right: 5px; top: 50%; transform: translateY(-50%); }

        .player-chip {
            position: absolute; padding: 6px 12px; background: white;
            border: 1.5px solid var(--accent); border-radius: 20px;
            font-weight: 600; font-size: 0.85rem; cursor: move;
            z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            white-space: nowrap; touch-action: none;
        }

        .controls {
            height: 80px; display: flex; justify-content: center;
            align-items: center; gap: 10px; padding-bottom: 10px;
        }

        button {
            padding: 12px 20px; background: var(--accent); color: white;
            border: none; border-radius: 10px; font-weight: 600; cursor: pointer;
        }
        .btn-start { width: 100%; max-width: 350px; }
        .btn-alt { background: #666; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="screen-setup">
    <h2 style="margin-top:0">Juego de las ideologías</h2>
    <div class="input-group">
        <input type="text" id="nameInput" placeholder="Nombre...">
        <button onclick="addName()">+</button>
    </div>
    <div id="nameList"></div>
    <div style="flex:1"></div> <!-- Empuja el botón abajo -->
    <button id="btnStart" class="btn-start" onclick="startGame()" disabled>Empezar</button>
</div>

<div id="screen-game">
    <div id="export-area">
        <div class="map-wrapper" id="map">
            <div class="axis-h"></div>
            <div class="axis-v"></div>
            <div class="label top">Peronismo</div>
            <div class="label bottom">Antiperonismo</div>
            <div class="label left">Izquierda</div>
            <div class="label right">Derecha</div>
        </div>
    </div>
    
    <div class="controls">
        <button onclick="download()">📸 Guardar</button>
        <button class="btn-alt" onclick="location.reload()">Reiniciar</button>
    </div>
</div>

<script>
    let players = [];

    function addName() {
        const input = document.getElementById('nameInput');
        const n = input.value.trim();
        if(n) {
            players.push(n);
            document.getElementById('nameList').innerHTML += `<span class="name-tag">${n}</span>`;
            input.value = '';
            document.getElementById('btnStart').disabled = false;
        }
    }

    function startGame() {
        document.getElementById('screen-setup').style.display = 'none';
        document.getElementById('screen-game').style.display = 'flex';
        const map = document.getElementById('map');
        
        players.forEach((name, i) => {
            const div = document.createElement('div');
            div.className = 'player-chip';
            div.innerText = name;
            // Repartir un poco las fichas al inicio para que no se pisen todas
            div.style.left = '10px';
            div.style.top = (10 + (i * 35)) + 'px';
            initDrag(div);
            map.appendChild(div);
        });
    }

    function initDrag(el) {
        let x = 0, y = 0;
        el.addEventListener('mousedown', start);
        el.addEventListener('touchstart', start, {passive: false});

        function start(e) {
            e.preventDefault();
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            x = cx; y = cy;
            document.onmousemove = move;
            document.ontouchmove = move;
            document.onmouseup = stop;
            document.ontouchend = stop;
        }

        function move(e) {
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            const dx = x - cx;
            const dy = y - cy;
            x = cx; y = cy;
            
            // Límites para que no se escapen del cuadro
            let newTop = el.offsetTop - dy;
            let newLeft = el.offsetLeft - dx;
            const parent = el.parentElement;
            
            if(newTop > 0 && newTop < (parent.offsetHeight - el.offsetHeight)) el.style.top = newTop + "px";
            if(newLeft > 0 && newLeft < (parent.offsetWidth - el.offsetWidth)) el.style.left = newLeft + "px";
        }

        function stop() {
            document.onmousemove = document.onmouseup = null;
            document.ontouchmove = document.ontouchend = null;
        }
    }

    function download() {
        const area = document.getElementById('export-area');
        html2canvas(area, { backgroundColor: "#fdfaf5", scale: 2 }).then(canvas => {
            const a = document.createElement('a');
            a.download = 'ideologia-grupo.png';
            a.href = canvas.toDataURL();
            a.click();
        });
    }
</script>

</body>
</html>
